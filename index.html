<style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
canvas{-webkit-user-select:none;user-select:none;-webkit-user-drag:none}
html,body{margin:0;height:100%;position:fixed;inset:0;width:100%;background:#050608;color:#e8f1ff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation;overscroll-behavior:none}
.screen{position:fixed;left:0;right:0;top:0;height:100%;height:100dvh;display:none;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.screen.on{display:flex}
.btn{border:none;border-radius:14px;font-weight:800;color:#fff;cursor:pointer;transition:transform .06s,filter .06s,box-shadow .06s;box-shadow:0 4px 0 rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.25);font-family:inherit}
.btn.pressed,.btn:active{transform:translateY(3px) scale(.97);filter:brightness(1.45);box-shadow:0 1px 0 rgba(0,0,0,.55)}

/* ホーム */

.menu{width:min(92vw,420px);display:flex;flex-direction:column;gap:12px;margin:8px 0 18px}
.menu .btn{padding:16px;font-size:20px;background:linear-gradient(180deg,#2a6b55,#174536)}

.btn.insta{background:linear-gradient(135deg,#f58529,#dd2a7b 50%,#8134af)}

<script>// ===== 物理（グランツーリスモ風：タイヤの滑り・荷重移動・クラッチ・ターボの遅れ） =====
const PHY = (() => {
  const G = 9.81, M = 1480, R = 0.322, EFF = 0.87, LIMIT = 8500;
  const IE = 0.28;   // エンジン＋フライホイールの重さ（回りにくさ）
  const IW = 3.2;    // 後輪2本＋ドライブシャフト
  const H_CG = 0.52, WB = 2.73, REAR = 0.47; // 重心の高さ・ホイールベース・後ろの重さの割合
  const CLUTCH = 2000; // ツインプレートのクラッチ（NOSにも耐える）
  const SUB = 10;      // 1歩を10回に分けて計算（タイヤの計算を安定させる）
  const GEARSETS = {
    std:   [3.20, 2.10, 1.55, 1.22, 1.00, 0.84],
    close: [2.90, 2.00, 1.50, 1.21, 1.00, 0.86],
    long:  [3.45, 2.25, 1.62, 1.26, 1.00, 0.80]
  };
  const SHAPE = [[0,.45],[1000,.55],[3000,.75],[5000,.95],[6500,1],[7500,.97],[8500,.86],[10000,.7]];
  const clamp = (x,a,b) => x < a ? a : x > b ? b : x;
  const RPM = w => w * 60 / (2*Math.PI), W_ = r => r * 2*Math.PI / 60;
  function shape(r){
    for (let i = 1; i < SHAPE.length; i++) if (r <= SHAPE[i][0]) {
      const [x0,y0] = SHAPE[i-1], [x1,y1] = SHAPE[i]; return y0 + (y1-y0)*(r-x0)/(x1-x0);
    }
    return .7;
  }
  const torque = (rpm, boost) => 262 * shape(rpm) * (1 + 0.94 * Math.max(boost, -0.6));
  const friction = rpm => 18 + rpm * 0.0055;           // エンジンブレーキ
  // タイヤ：滑り率とグリップ（パジェカ式を簡単にしたもの）。滑り10%前後で一番掴む
  function grip(k){
    const B = 12, C = 1.6, E = 0.4, x = B * k;
    return Math.sin(C * Math.atan(x - E * (x - Math.atan(x))));
  }
  const breakChance = b => b <= 1.5 ? 0 : 0.5 * Math.pow((b - 1.5) / 1.0, 2);

  function makeCar(cfg, rnd){
    return { cfg, rnd: rnd || Math.random,
      v:0, d:0, a:0, we: W_(900), ww:0, rpm:900, gear:0, boost:0, slip:0, yaw:0, yawDir:1,
      cut:0, staged:false, launched:false, tcs:1, clutchCap:0, clutchFloor:0, locked:false,
      throttle:0, targetBoost:cfg.boost, blown:false, blowAt:Infinity, finish:null, limiter:false, wasSlip:false,
      pitch:0, pitchV:0 };
  }
  function shift(c, g, cutTime){
    if (g < 0 || g > 6 || g === c.gear) return false;
    c.gear = g; c.cut = cutTime; c.locked = false; return true;
  }
  function launch(c){ c.launched = true; c.throttle = 1; c.clutchCap = CLUTCH; c.locked = false; c.launchPhase = c.gear > 0; }

  function sub(c, dt){
    const ratios = GEARSETS[c.cfg.gears] || GEARSETS.std;
    const Gr = c.gear > 0 ? ratios[c.gear-1] * c.cfg.final : 0;
    const cutting = c.cut > 0;
    let rpm = RPM(c.we);
    c.limiter = rpm >= LIMIT;
    // アクセル：シフト中は抜ける。スタート前は2ステップで決めた回転を保つ
    let thr = (!c.blown && c.throttle && !cutting) ? 1 : 0;
    if (!c.launched) thr = c.blown ? 0 : (c.staged ? clamp((c.cfg.launchRpm - rpm) / 400 + .35, 0, 1) : (c.throttle ? 1 : 0));
    if (c.limiter) thr = 0;
    // ターボ（排気の量で回る。T88は大きいので遅れて効く）
    const flow = thr * clamp((rpm - 2600) / 3800, 0, 1);
    let tgtB = c.targetBoost * Math.pow(flow, 1.3), tau = .45;
    if (!c.launched && c.staged) tgtB = c.targetBoost * clamp((rpm - 2600) / 3000, 0, 1) * .8;
    if (thr === 0) { tgtB = -0.5; tau = cutting ? .7 : .3; }
    if (c.blown) { tgtB = -0.6; tau = .2; }
    c.boost += (tgtB - c.boost) * Math.min(1, dt / tau);
    // トラクションコントロール（ONなら空転しそうな時にパワーを絞る）
    const kNow = (c.ww * R - c.v) / Math.max(c.v, 6);
    if (c.cfg.tcs && c.launched) { if (kNow > .17) c.tcs = Math.max(.35, c.tcs - dt * 7); else c.tcs = Math.min(1, c.tcs + dt * 3); }
    else c.tcs = 1;
    const Te = c.blown ? -friction(rpm) * 3 : thr * torque(rpm, c.boost) * c.tcs * (c.nos ? 2.3 : 1) - friction(rpm);

    // クラッチ：スタートでつながる途中・シフトの後は滑りながらつながる
    let cap;
    if (!c.launched || c.gear === 0 || cutting) cap = 0;
    else if (c.launchPhase) cap = Math.max(0, Te + friction(rpm)) * .97 + 20; // スタートは回転を保ったまま半クラッチ
    else { c.clutchCap = Math.min(CLUTCH, c.clutchCap + dt * CLUTCH * 3); cap = Math.min(c.clutchCap, Math.max(160, torque(Math.max(rpm, 3000), c.boost) * 1.3 * (c.nos ? 2.3 : 1))); }
    if (cutting) c.clutchCap = CLUTCH * .85; // シフト後はすぐつなぐ（ショックが出る）

    // 後輪の荷重（加速すると後ろに沈む）
    const Nr = M * G * REAR + M * Math.max(0, c.a) * H_CG / WB;
    const vden = Math.max(c.v, 6);
    const k = (c.ww * R - c.v) / vden;
    const mu = (1.62 + .12 * Math.min(c.v / 40, 1)) * (c.nos ? 1.2 : 1); // NOS中は後ろに沈んでタイヤが食いつく
    const Fx = mu * Nr * grip(k);

    // エンジンと後輪
    const dW = c.we - c.ww * Gr;
    if (Gr > 0 && cap > 0) {
      // つながったまま回れるか
      const Ieq = IE * Gr * Gr / EFF + IW;
      const aw = (Te * Gr * EFF - Fx * R) / Ieq;
      const tReq = Te - IE * aw * Gr;
      const hooked = !c.launchPhase || k < .2;
      if ((c.locked || Math.abs(dW) < 8) && hooked && (Math.abs(tReq) <= cap || c.launchPhase)) {
        c.locked = true; c.launchPhase = false; c.ww += aw * dt; c.we = c.ww * Gr;
      } else {
        c.locked = false;
        const Tc = (c.launchPhase && dW < 0) ? 0 : Math.sign(dW) * cap;
        c.we += (Te - Tc) / IE * dt;
        c.ww += (Tc * Gr * EFF - Fx * R) / IW * dt;
      }
    } else {
      c.locked = false;
      c.we += Te / IE * dt;
      c.ww += (-Fx * R) / IW * dt;
    }
    c.we = Math.max(c.blown ? 0 : W_(750), Math.min(W_(9200), c.we));
    if (c.ww < 0) c.ww = 0;

    // 車体：タイヤの力－空気抵抗－転がり－ぶれによる損
    const slipping = k > .3;
    if (slipping && !c.wasSlip) c.yawDir = c.rnd() < .5 ? -1 : 1;
    c.wasSlip = slipping;
    if (slipping) c.yaw += c.yawDir * Math.min(k - .25, 1) * Math.min(c.v / 15, 1.2) * .9 * dt;
    c.yaw = clamp(c.yaw, -1.2, 1.2);
    const Fyaw = Math.abs(c.yaw) * 4200 * Math.min(c.v / 10, 1);
    const Fres = 0.416 * c.v * c.v + 0.014 * M * G + (c.blown ? 900 : 0);
    let acc = (Fx - Fres - Fyaw) / M;
    if (c.v <= 0 && acc < 0) acc = 0;
    c.v = Math.max(0, c.v + acc * dt);
    c.d += c.v * dt;
    c.a += (acc - c.a) * Math.min(1, dt / .05);
    c.slip = Math.max(0, k);
    // 車体の前後の揺れ（加速で頭が上がり、シフトでお辞儀）
    const tgtP = c.a * .006;
    c.pitchV += ((tgtP - c.pitch) * 90 - c.pitchV * 9) * dt;
    c.pitch += c.pitchV * dt;
  }
  function step(c, dt){
    if (c.cut > 0) c.cut -= dt;
    const h = dt / SUB;
    for (let i = 0; i < SUB; i++) sub(c, h);
    c.rpm = RPM(c.we);
    c.clutchFloor = 0;
    if (!c.blown && c.d >= c.blowAt) c.blown = true;
  }
  return { GEARSETS, LIMIT, makeCar, step, shift, launch, breakChance, clamp, grip };
})();
if (typeof module !== 'undefined') module.exports = PHY;

// ===== ゼロヨンバトル 本体 =====
const VERSION = 'v1.8.1 (2026-11-17)';
const $ = id => document.getElementById(id);
const JA = (navigator.language || 'ja').toLowerCase().startsWith('ja');
const TXT = {
  spec:['100系チェイサー 1.5J / T88-34D / ゲトラグ6速','Chaser JZX100 1.5J / T88-34D / Getrag 6-speed'],
  start:['スタート','START'], settings:['セッティング','SETTINGS'], code:['走りコード（ゴースト対戦）','Run code (ghost battle)'],

// ===== 音 =====
let AC = null, eng = null;
function audioInit(){
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    const g = AC.createGain(); g.gain.value = 0; g.connect(AC.destination);
    const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 900; f.connect(g);
    const o1 = AC.createOscillator(); o1.type = 'sawtooth'; o1.connect(f); o1.start();
    const o2 = AC.createOscillator(); o2.type = 'square'; const g2 = AC.createGain(); g2.gain.value = .5; o2.connect(g2); g2.connect(f); o2.start();
    const tb = AC.createOscillator(); tb.type = 'sine'; const tg = AC.createGain(); tg.gain.value = 0; tb.connect(tg); tg.connect(AC.destination); tb.start();
    // ドグミッションのギア鳴り（ストレートカットギアの「ヒューン」）
    const wo = AC.createOscillator(); wo.type = 'sawtooth';
    const wf = AC.createBiquadFilter(); wf.type = 'bandpass'; wf.Q.value = 6; wf.frequency.value = 2000;
    const wg = AC.createGain(); wg.gain.value = 0; wo.connect(wf); wf.connect(wg); wg.connect(AC.destination); wo.start();
    // タイヤの鳴き（キュルキュル）：高めの音を細かく揺らす
    const so = AC.createOscillator(); so.type = 'sawtooth'; so.frequency.value = 1050;
    const sl = AC.createOscillator(); sl.frequency.value = 23; const sld = AC.createGain(); sld.gain.value = 140; sl.connect(sld); sld.connect(so.frequency); sl.start();
    const sf = AC.createBiquadFilter(); sf.type = 'bandpass'; sf.Q.value = 3; sf.frequency.value = 1300;
    const sg = AC.createGain(); sg.gain.value = 0; so.connect(sf); sf.connect(sg); sg.connect(AC.destination); so.start();
    // NOSの噴射音（シューッ）：ノイズを鳴らし続けて音量で出し入れ
    const nb = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate), nd = nb.getChannelData(0);
    for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    const ns = AC.createBufferSource(); ns.buffer = nb; ns.loop = true;
    const nf = AC.createBiquadFilter(); nf.type = 'bandpass'; nf.frequency.value = 2200; nf.Q.value = .7;
    const ng = AC.createGain(); ng.gain.value = 0; ns.connect(nf); nf.connect(ng); ng.connect(AC.destination); ns.start();
    eng = { g, f, o1, o2, tb, tg, wo, wf, wg, sg, so, ng };
  } catch(e){ AC = null; }
}
function noiseBurst(dur, freq, vol, q){
  if (!AC || !S.sound) return;
  const n = AC.sampleRate * dur, b = AC.createBuffer(1, n, AC.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random()*2-1) * (1 - i/n);
  const s = AC.createBufferSource(); s.buffer = b;
  const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q || 1;
  const g = AC.createGain(); g.gain.value = vol;
  s.connect(f); f.connect(g); g.connect(AC.destination); s.start();
}

// ドグミッションのシフト音（金属が噛み合う「ガチャン」）
function dogClack(){
  if (!AC || !S.sound) return;
  noiseBurst(.035, 2600, .7, 5);
  setTimeout(() => noiseBurst(.11, 380, .9, 1.6), 18);
  const o = AC.createOscillator(), g = AC.createGain(); o.type = 'square'; o.frequency.value = 95;
  g.gain.setValueAtTime(.22, AC.currentTime); g.gain.exponentialRampToValueAtTime(.0001, AC.currentTime + .09);
  o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime + .1);
}

function beep(){
  if (!AC || !S.sound) return;
  const o = AC.createOscillator(), g = AC.createGain(); o.frequency.value = 1500; o.type = 'square';
  g.gain.setValueAtTime(.06, AC.currentTime); g.gain.exponentialRampToValueAtTime(.0001, AC.currentTime + .05);
  o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime + .06);
}
function tone(freq, dur, vol){
  if (!AC || !S.sound) return;
  const o = AC.createOscillator(), g = AC.createGain(); o.frequency.value = freq; o.type = 'sine';
  g.gain.setValueAtTime(vol, AC.currentTime); g.gain.exponentialRampToValueAtTime(.0001, AC.currentTime + dur);
  o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime + dur + .02);
}
function engineSound(c, on){
  if (!eng) return;
  const t = AC.currentTime;
  if (!on || !S.sound || c.rpm < 50) { eng.g.gain.setTargetAtTime(0, t, .05); eng.tg.gain.setTargetAtTime(0, t, .05); eng.wg.gain.setTargetAtTime(0, t, .05); eng.sg.gain.setTargetAtTime(0, t, .05); eng.ng.gain.setTargetAtTime(0, t, .05); return; }
  const fr = c.rpm / 60 * 3;
  eng.o1.frequency.setTargetAtTime(fr, t, .015); eng.o2.frequency.setTargetAtTime(fr/2, t, .015);
  const thr = c.throttle && c.cut <= 0 ? 1 : (c.staged && !c.launched ? .7 : .2);
  eng.f.frequency.setTargetAtTime(350 + thr*1700 + c.rpm*.08, t, .03);
  let v = .05 + thr*.07; if (c.limiter && Math.random() < .5) v *= .15;
  eng.g.gain.setTargetAtTime(v, t, .02);
  const bb = Math.max(0, c.boost);
  eng.tb.frequency.setTargetAtTime(1800 + bb*1900 + c.rpm*.15, t, .05);
  eng.tg.gain.setTargetAtTime(bb * .006, t, .05);
  // Iパターン（ドグ）の時だけ：回転に合わせたギア鳴り。アクセルを抜いた時の方が大きく鳴る
  if (S.mode === 'I' && c.launched && c.gear > 0 && c.v > .5) {
    const wfq = c.rpm / 60 * 21;
    eng.wo.frequency.setTargetAtTime(wfq, t, .02); eng.wf.frequency.setTargetAtTime(wfq, t, .02);
    const coast = !(c.throttle && c.cut <= 0);
    eng.wg.gain.setTargetAtTime((coast ? .05 : .03) * Math.min(1, c.v / 15), t, .04);
  } else eng.wg.gain.setTargetAtTime(0, t, .05);
  // 空転した分だけタイヤが鳴く
  const sq = c.launched && !c.blown ? Math.max(0, Math.min(1, (c.slip - .14) * 1.6)) : 0;
  eng.sg.gain.setTargetAtTime(sq * .06, t, .03);
  eng.ng.gain.setTargetAtTime(c.nos ? .09 : (R && R.purgeT > 0 ? .07 : 0), t, .04);
  eng.so.frequency.setTargetAtTime(950 + Math.min(c.v, 40) * 6 + sq * 250, t, .05);
}

(() => {
  const bn = $('banner'), tr = $('bannerTrack'); let x = null, phase = 0, wait = 0, last = 0;
  function f(ts){
    const dt = Math.min(.05, (ts - last) / 1000 || 0); last = ts;
    const W = bn.clientWidth, w = tr.offsetWidth, stop = (W - w) / 2;
    if (x === null) x = W;
    if (phase === 0) { x -= 90*dt; if (x <= stop) { x = stop; phase = 1; wait = 3; bn.classList.add('glow'); } }
    else if (phase === 1) { wait -= dt; if (wait <= 0) { phase = 2; bn.classList.remove('glow'); } }
    else { x -= 90*dt; if (x < -w) { x = W; phase = 0; } }
    tr.style.transform = 'translateX(' + x + 'px)';
    requestAnimationFrame(f);
  }
  requestAnimationFrame(f);
  bn.onclick = () => info(T('bannerTitle'), '<div style="text-align:center;font-size:44px;font-weight:900;background:#1e5bd8;border-radius:16px;padding:20px;margin-bottom:10px">M</div><div style="text-align:center;font-size:20px;font-weight:900">MIRATERIA ミラテリア</div><div style="text-align:center">' + T('bannerBody') + '</div>');
})();

function drawCar(ctx, x, y, s, color, yaw, lit){
  const sp = color === MYCOL ? SPR.g : color === OPPCOL ? SPR.w : null;
  if (sp && sp.complete && sp.naturalWidth) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(yaw * .14);
    const ug = ctx.createRadialGradient(0, 0, 0, 0, 0, 1.3*s); ug.addColorStop(0, rgba(color, .35)); ug.addColorStop(1, rgba(color, 0));
    ctx.fillStyle = ug; ctx.beginPath(); ctx.ellipse(0, 0, 1.3*s, .35*s, 0, 0, 7); ctx.fill();
    const w = 1.95*s, h = w * sp.naturalHeight / sp.naturalWidth;
    ctx.drawImage(sp, -w/2, -h + .02*s, w, h);
    ctx.restore(); return;
  }
  // x,y = 車の下中央、s = 1mあたりのピクセル（後ろの少し上から見た形）
  ctx.save(); ctx.translate(x, y); ctx.rotate(yaw * .14); ctx.scale(s, s);
  const L = (pts) => { ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]); ctx.closePath(); };
  ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.beginPath(); ctx.ellipse(0, 0, 1.15, .2, 0, 0, 7); ctx.fill();
  // 光る下地
  const glow = ctx.createRadialGradient(0, -.7, .1, 0, -.7, 1.6); glow.addColorStop(0, rgba(color, .22)); glow.addColorStop(1, rgba(color, 0));
  ctx.fillStyle = glow; ctx.fillRect(-1.8, -2.4, 3.6, 2.6);
  const body = [[-.9,-.05],[.9,-.05],[.92,-.55],[.86,-.8],[-.86,-.8],[-.92,-.55]];
  const deck = [[-.86,-.8],[.86,-.8],[.78,-1.0],[-.78,-1.0]];
  const glass = [[-.72,-1.0],[.72,-1.0],[.56,-1.3],[-.56,-1.3]];
  const roof = [[-.56,-1.3],[.56,-1.3],[.5,-1.72],[-.5,-1.72]];
  ctx.lineWidth = .028; ctx.lineJoin = 'round';
  // タイヤ
  ctx.strokeStyle = rgba(color, .8); ctx.fillStyle = 'rgba(5,10,14,.9)';
  for (const sx of [-.78, .78]) { rr(ctx, sx - .14, -.42, .28, .42, .05); ctx.fill(); ctx.stroke(); }
  ctx.fillStyle = rgba(color, .1);
  for (const p of [body, deck, roof]) { L(p); ctx.fill(); }
  ctx.fillStyle = 'rgba(10,20,28,.85)'; L(glass); ctx.fill();
  // 網目（ワイヤー）

const SRCW = 758, SRCH = 941, SX0 = 662, BAR = 50; // 室内の絵の元の大きさ
function layout(){
  const race = $('race'); if (!race.classList.contains('on')) return;
  const cs = getComputedStyle(race);
  const W = race.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const avail = race.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  const sc = Math.min((W - BAR) / SRCW, (avail - 160) / SRCH);
  const imgW = SRCW * sc, imgH = Math.round(SRCH * sc);
  $('top').style.flex = '0 0 ' + imgH + 'px';
  TOP = fit($('top')); CP = fit($('cp'));
  makeCockpitGeometry(sc, (W - BAR - imgW) / 2, imgW, imgH);
  $('quit').style.top = 'calc(env(safe-area-inset-top) + ' + (imgH + 5) + 'px)';
  const ms = $('msg').style, x0 = (W - BAR - imgW) / 2;
  ms.top = 'calc(env(safe-area-inset-top) + ' + Math.round(172 * sc) + 'px)';
  ms.left = 'calc(env(safe-area-inset-left) + ' + Math.round(x0 + (850 - SX0) * sc) + 'px)';
  ms.right = Math.round(BAR + x0 + 125 * sc) + 'px'; ms.fontSize = Math.max(13, Math.min(18, 40 * sc)) + 'px';
  CPS = null;
}
window.addEventListener('resize', () => { layout(); drawHomeCar(); });

function drawHomeCar(){
  const cv = $('homeCar'); const { c, W, H } = fit(cv);
  const yh = H*.18;
  c.strokeStyle = 'rgba(61,255,214,.25)'; c.lineWidth = 1;
  for (let i = -8; i <= 8; i++) { c.beginPath(); c.moveTo(W/2 + i*6, yh); c.lineTo(W/2 + i*W*.16, H); c.stroke(); }
  for (let k = 1; k < 8; k++) { const y = yh + (H - yh) * Math.pow(k/8, 2); c.beginPath(); c.moveTo(0, y); c.lineTo(W, y); c.stroke(); }
  drawCar(c, W/2, H - 6, H/1.95, MYCOL, 0, true);
}

// ===== レース =====
const CPU = { cpu1:{boost:1.2, launchRpm:4500, shift:7600, cut:.3, react:.4, fix:.6},
              cpu2:{boost:1.6, launchRpm:5000, shift:8000, cut:.2, react:.3, fix:.35},
              cpu3:{boost:2.1, launchRpm:5600, shift:8200, cut:.12, react:.18, fix:.15} };
let R = null;
function newRace(){
  const me = PHY.makeCar({ gears:S.gears, final:S.final, boost:S.boost, launchRpm:S.launchRpm, tcs:S.tcs });
  if (Math.random() < PHY.breakChance(S.boost)) me.blowAt = 60 + Math.random()*330;
  let opp = null, ghost = null, oppName = '';
  const cpu = k => { const o = PHY.makeCar({ gears:'std', final:3.73, boost:k.boost, launchRpm:k.launchRpm, tcs:1 }); o.ai = k; o.fixT = 0; return o; };
  const isNet = !!S._netRace;
  if (isNet) { oppName = T('netRival'); }
  else if (S.opp.startsWith('cpu')) { opp = cpu(CPU[S.opp]); oppName = 'CPU'; }
  else {
    const src = S.opp === 'best' ? BEST : RIVAL;
    if (src && src.s) { ghost = src; oppName = S.opp === 'best' ? T('best') : (src.n || T('ghost')); }
    else { opp = cpu(CPU.cpu2); oppName = 'CPU'; }
  }
  R = { me, opp, ghost, oppName, state:'pre', t:0, treeAt:0, greenAt:0,
        scramUsed:false, trace:[], traceT:0, react:null, msgT:0, smoke:[], oppD:0, oppFin:null, endT:0, foul:false,
        nosArmed:false, nosOn:false, nosLeft:4, purgeT:0, nosFx:0, accelId:null, accelBlock:false, knob:{x:0, y:0}, shiftId:null, iLever:0, wheelRot:0, steerFlash:0 };
  if (isNet) { R.net = true; R.netOpp = { d:0, v:0, yaw:0, rt:0, fire:0, foul:false, blown:false }; R.treeAt = (NET.startAtLocal - performance.now()) / 1000; }
  flash(S.mode === 'H' ? T('hintH') : S.mode === 'I' ? T('hintI') : T('hintA'), 99);
  if (S.mode === 'A') { R.knob.y = 1; setGear(1); }
}
function flash(m, sec){ if (!R) return; R.msgT = sec || 1.4; $('msg').innerHTML = m; }

function startRace(){
  closeM('mResult');
  $('home').classList.remove('on'); $('race').classList.add('on');
  pinScreen(); layout(); newRace(); last = performance.now();
  setTimeout(() => { pinScreen(); layout(); }, 350);
  if (!loopOn) { loopOn = true; requestAnimationFrame(loop); }
}
function toHome(){
  closeM('mResult'); $('race').classList.remove('on'); $('home').classList.add('on');
  if (R) engineSound(R.me, false); R = null; refreshBest(); drawHomeCar();
}
let LASTNET = false;
$('bStart').onclick = startRace;
$('bAgain').onclick = () => { if (LASTNET && NET.connected) { if (NET.host) netHostStart(); else { $('resBig').innerHTML = '<span style="font-size:16px">' + T('netAgainGuest') + '</span>'; } } else startRace(); }; $('bToHome').onclick = toHome;
$('quit').onclick = toHome;

// --- ギアを入れる ---
function setGear(g){
  if (!R || R.state === 'done' || R.me.blown) return;
  const me = R.me, prev = me.gear;
  if (g === prev) return;
  me.gear = g; me.cut = g > 0 ? .12 : 0;
  if (g > 0 && prev === 0 && me.launched && me.v < 3) me.launchPhase = true; // 回転を上げたまま半クラッチでつなぐ
  if (g > prev && prev > 0 && me.launched) { afterfire(me); kick(1); thump(.9); }
  if (g > 0) {
    if (me.launched && me.boost > .6) noiseBurst(.35, 3500, .12, .7);
    if (S.mode === 'I') dogClack(); else noiseBurst(.06, 900, .25, 2);
    if (navigator.vibrate) try{ navigator.vibrate(15); }catch(_){}
  }
  if (R.state === 'pre' && g === 1) {
    R.state = 'staged'; me.staged = true; if (!R.net) R.treeAt = R.t + 1 + Math.random()*1.3; flash(T('staged'), 99);
    if (R.accelId !== null) { R.accelBlock = true; me.throttle = 0; }
  }
}

// --- アクセル（押している間だけ踏む） ---
function accelDown(id){
  if (!R || R.state === 'done') return;
  const me = R.me;
  if (R.state === 'staged') {
    R.foul = true; R.state = 'done'; me.throttle = 0; flash(T('foul'), 99); tone(220, .6, .2); R.endT = R.t;
    setTimeout(showResult, 1200); return;
  }
  R.accelId = id; R.accelBlock = false; me.throttle = 1;
  if (R.state === 'go' && !me.launched) { PHY.launch(me); if (me.gear > 0) { kick(.8); thump(.7); } }
}
function accelUp(){ if (!R) return; R.accelId = null; R.accelBlock = false; if (!R.me.blown) R.me.throttle = 0; }

function steer(dir){ if (!R || !R.me.launched) return; R.me.yaw += dir * .17; R.wheelRot = -dir * .35; }
function scramble(){
  if (!R || R.scramUsed || !R.me.launched || R.me.blown || R.state !== 'go') return;
  R.scramUsed = true; const me = R.me;
  const pN = PHY.breakChance(S.boost), pS = PHY.breakChance(Math.max(S.boost, S.scramble));
  if (me.blowAt === Infinity && pS > pN && Math.random() < (pS - pN) / (1 - pN)) me.blowAt = me.d + 15 + Math.random()*Math.max(20, 400 - me.d);
  me.targetBoost = Math.max(S.boost, S.scramble);
  R.wipe = 0; scramSound();
}

// ===== 室内の配置 =====
function makeCockpitGeometry(sc, x0, imgW, imgH){
  const P = (x, y) => [x0 + (x - SX0) * sc, y * sc];
  const T = { sc, x0, imgW, imgH, glassH: 405 * sc, P };
  const [wcx, wcy] = P(1046, 700), [hx, hy] = P(1046, 763), [sx, sy] = P(1215, 735);
  T.wheel = { x: wcx, y: wcy, r: 330 * sc };
  T.hub = { x: hx, y: hy, r: 52 * sc };
  T.scram = { x: sx, y: sy, r: Math.max(15, 34 * sc) };
  const { W, H } = CP, strip = 30, ph = H - strip, colW = W / 3;
  const kr = Math.max(12, Math.min(18, colW * .12));
  const ly = Math.max(16, Math.min(50, (ph - 2 * (kr + 22)) / 2));
  const gate = { cx: colW * .52, cy: strip + ph / 2, lx: Math.min(colW * .28, 40), ly, kr };
  const ar = Math.max(30, Math.min(colW * .42, ph * .4));
  const accel = { x: W - colW * .5, y: strip + ph / 2, r: ar };
  const rowH = 40;
  let iw = colW * 1.0, ih = iw * 200 / 300; if (ih > ph - rowH - 10) { ih = ph - rowH - 10; iw = ih * 300 / 200; }
  const top = strip + Math.max(4, (ph - ih - rowH) / 2);
  const ign = { x: W / 2 - iw / 2 + colW * .02, y: top, w: iw, h: ih };
  // 隠しスイッチ（点火カットのパネルの下）：左にパージ、右に黒いNOSボタン
  const ry = top + ih + rowH / 2 + 2;
  const purge = { x: ign.x + ign.w * .3, y: ry, w: 16, h: 26 };
  const nos = { x: ign.x + ign.w * .7, y: ry, r: 13 };
  G = { T, W, H, strip, gate, accel, ign, purge, nos, con: { x: 0, y: strip, w: colW * 1.02, h: ph } };
}

// ===== 操作（タッチ） =====
const cpEl = $('cp');

const pressFx = {};

// ハンドル（修正）とスクランブルは上の絵の中
const topEl = $('top');
topEl.addEventListener('pointerdown', e => {

// --- メインループ ---
let last = 0, loopOn = false;

  for (const k in pressFx) pressFx[k] = Math.max(0, pressFx[k] - fdt);
  if (S.mode === 'I' && R.shiftId === null) R.knob.y *= Math.pow(.0005, fdt);
  R.wheelRot *= Math.pow(.02, fdt);

  syncViewport(); shakeScreen(fdt); if (typeof netTick === 'function') netTick(fdt); drawTop(); drawCockpit();
  if (R.msgT < 50) { R.msgT -= fdt; if (R.msgT <= 0) $('msg').innerHTML = ''; }

}
function oppDist(t){

    const k = R.t - R.treeAt;
    // 対戦の時は、2台とも同じ時刻に青になる（ギアが入っていなくても青になる）
    if (k >= 1.5) { R.state = 'go'; R.greenAt = R.net ? R.treeAt + 1.5 : R.t; flash('GO!', .8); tone(1320, .25, .12); }

    const o = R.opp;

    if (R.greenAt && !o.launched && R.t - R.greenAt >= o.ai.react) PHY.launch(o);

// --- 上半分：コース（ワイヤーフレーム風） ---

// ===== 揺れ（目と耳で体に来る感じ）＋Androidは振動 =====

}

function drawWipe(c, T, t){

// --- 合図（ntfy.sh） ---
function netSigSend(k, d, to){
  if (window.__TEST_SIG) return window.__TEST_SIG.send(NET.topic(), JSON.stringify({ f: NET.me, k, d, to }));
  return fetch('https://ntfy.sh/' + NET.topic(), { method: 'POST', body: JSON.stringify({ f: NET.me, k, d, to }) }).catch(() => netStatus(T('netFail'), true));
}
function netSigListen(onMsg){
  if (window.__TEST_SIG) { window.__TEST_SIG.listen(NET.topic(), raw => { try { onMsg(JSON.parse(raw)); } catch(e){} }); return; }
  try {
    const es = new EventSource('https://ntfy.sh/' + NET.topic() + '/sse');
    NET.es = es;
    es.onmessage = ev => { try { const m = JSON.parse(ev.data); if (m.event === 'message') onMsg(JSON.parse(m.message)); } catch(e){} };
  } catch(e){ netStatus(T('netFail'), true); }
}
function waitIce(pc){
  return new Promise(res => {
    if (pc.iceGatheringState === 'complete') return res();
    const t = setTimeout(res, 2500);
    pc.addEventListener('icegatheringstatechange', () => { if (pc.iceGatheringState === 'complete') { clearTimeout(t); res(); } });
  });
}
function netNewPC(){
  const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
  pc.onconnectionstatechange = () => {
    if (pc.connectionState === 'failed') netStatus(T('netFail'), true);
    if ((pc.connectionState === 'disconnected' || pc.connectionState === 'closed') && NET.connected) netLost();
  };
  return pc;
}
function netSetupDC(dc){
  NET.dc = dc;
  dc.onopen = () => { NET.connected = true; clearInterval(NET.helloT); if (NET.es) { NET.es.close(); NET.es = null; } netOnOpen(); };
  dc.onclose = () => { if (NET.connected) netLost(); };
  dc.onmessage = ev => { try { netOnData(JSON.parse(ev.data)); } catch(e){} };
}
function netSend(o){ try { if (NET.dc && NET.dc.readyState === 'open') NET.dc.send(JSON.stringify(o)); } catch(e){} }

// --- 部屋を作る（ホスト） ---
async function netCreate(){
  if (!navigator.onLine) return netStatus(T('netNoNet'), true);
  netReset(); NET.host = true;
  NET.code = String(1000 + Math.floor(Math.random() * 9000));
  $('netCodeBig').textContent = NET.code; $('netCodeBig').style.display = 'block';
  netStatus(T('netWait'));
  try {
    const pc = NET.pc = netNewPC();
    netSetupDC(pc.createDataChannel('zb'));
    await pc.setLocalDescription(await pc.createOffer());
    await waitIce(pc);
    netSigListen(async m => {
      if (m.f === NET.me) return;
      if (m.k === 'hello' && !NET.peer) { NET.peer = m.f; netStatus(T('netConn')); netSigSend('offer', pc.localDescription, m.f); }
      else if (m.k === 'hello' && m.f === NET.peer && !NET.connected) netSigSend('offer', pc.localDescription, m.f);
      else if (m.k === 'answer' && m.to === NET.me && m.f === NET.peer && !pc.currentRemoteDescription) {
        try { await pc.setRemoteDescription(m.d); } catch(e){ netStatus(T('netFail'), true); }
      }
    });
  } catch(e){ netStatus(T('netFail') + ' (' + (e && e.name || e) + ')', true); }
}
// --- 部屋に入る（ゲスト） ---
async function netJoin(){
  if (!navigator.onLine) return netStatus(T('netNoNet'), true);
  const code = ($('netCodeIn').value || '').replace(/\D/g, '').slice(0, 4);
  if (code.length !== 4) { $('netCodeIn').focus(); return; }
  netReset(); NET.host = false; NET.code = code;
  netStatus(T('netConn'));
  try {
    const pc = NET.pc = netNewPC();
    pc.ondatachannel = ev => netSetupDC(ev.channel);
    let answered = false;
    netSigListen(async m => {
      if (m.f === NET.me || m.k !== 'offer' || m.to !== NET.me || answered) return;
      answered = true; NET.peer = m.f;
      try {
        await pc.setRemoteDescription(m.d);
        await pc.setLocalDescription(await pc.createAnswer());
        await waitIce(pc);
        netSigSend('answer', pc.localDescription, m.f);
      } catch(e){ netStatus(T('netFail'), true); }
    });
    // 相手の準備ができるまで「来たよ」を何回か送る
    let n = 0;
    const hello = () => { if (NET.connected || answered && n > 3) return; netSigSend('hello'); if (++n > 20) { clearInterval(NET.helloT); if (!NET.connected) netStatus(T('netFail'), true); } };
    setTimeout(hello, 600); NET.helloT = setInterval(hello, 3000);
  } catch(e){ netStatus(T('netFail') + ' (' + (e && e.name || e) + ')', true); }
}
function netReset(){
  clearInterval(NET.helloT);
  if (NET.es) { NET.es.close(); NET.es = null; }
  try { if (NET.dc) NET.dc.close(); } catch(e){}
  try { if (NET.pc) NET.pc.close(); } catch(e){}
  Object.assign(NET, { pc: null, dc: null, peer: '', connected: false, off: 0, startAtLocal: 0 });
  $('netCodeBig').style.display = 'none'; $('netGo').style.display = 'none';
}
function netStatus(t, bad){ const s = $('netStatus'); s.textContent = t; s.style.color = bad ? '#ff8a6a' : '#9fe8cf'; }

// --- つながった後：時計合わせ ---
function netOnOpen(){
  netStatus(T('netOk'));
  if (NET.host) { $('netGo').style.display = 'block'; $('netGo').textContent = T('netStart'); }
  else {
    $('netGo').style.display = 'none'; $('netStatus').textContent = T('netOk') + '　' + T('netGuestWait');
    NET.samples = []; let i = 0;
    const ping = () => { netSend({ t: 'ping', a: performance.now() }); if (++i < 8) setTimeout(ping, 150); };
    ping();
  }
}
function netOnData(m){
  if (m.t === 'ping') netSend({ t: 'pong', a: m.a, b: performance.now() });
  else if (m.t === 'pong') {
    const now = performance.now(), rtt = now - m.a;
    NET.samples.push({ rtt, off: m.b - (m.a + rtt / 2) });
    NET.samples.sort((x, y) => x.rtt - y.rtt); NET.off = NET.samples[0].off; // 一番速く返った時の値を使う
  }
  else if (m.t === 'start') {
    NET.startAtLocal = m.at - NET.off; // ホストの時計 → 自分の時計
    netBeginRace();
  }
  else if (m.t === 's' && R && R.net) {
    const o = R.netOpp;
    o.d = m.d; o.v = m.v; o.yaw = m.y; o.rt = performance.now();
    if (m.f && !o.fire) o.fire = .3;
    if (m.fin !== null && m.fin !== undefined && R.oppFin === null) R.oppFin = m.fin;
    if (m.foul) o.foul = true;
    if (m.bl) o.blown = true;
  }
}
function netLost(){
  NET.connected = false;
  netStatus(T('netLost'), true);
  if (R && R.net) { R.netLost = true; flash(T('netLost'), 2.5); }
}
// ホストがスタート（3.5秒後に黄色が点き始める）
function netHostStart(){
  if (!NET.connected || !NET.host) return;
  const at = performance.now() + 3500;
  netSend({ t: 'start', at });
  NET.startAtLocal = at;
  netBeginRace();
}
function netBeginRace(){
  closeM('mNet'); closeM('mResult');
  S._netRace = true; startRace(); S._netRace = false;
}
// 走っている間、20回/秒で自分の位置を送る
function netTick(dt){
  if (!R || !R.net || !NET.connected) return;
  NET.sendT -= dt; if (NET.sendT > 0) return; NET.sendT = .05;
  const me = R.me;
  netSend({ t: 's', d: +me.d.toFixed(2), v: +me.v.toFixed(2), y: +me.yaw.toFixed(3), f: me.fire > .25 ? 1 : 0,
    fin: me.finish, foul: R.foul ? 1 : 0, bl: me.blown ? 1 : 0 });
}

$('bNet').onclick = () => { $('netStatus').textContent = ''; openM('mNet'); };
$('netCreateB').onclick = netCreate;
$('netJoinB').onclick = netJoin;
$('netGo').onclick = netHostStart;
$('netLeaveB').onclick = () => { netReset(); netStatus(''); closeM('mNet'); };
</script>
